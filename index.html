:root{font-family:Arial,Helvetica,sans-serif;color:#fff;background:#079fdf}*{box-sizing:border-box}body{margin:0;overscroll-behavior:none}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #fff;outline-offset:3px}.app{height:100dvh;min-height:360px;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 20%,#21b7f0 0%,#079cda 65%,#0784c8 100%)}header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 18px;min-height:64px}.tools{display:flex;align-items:center;gap:8px}.tool{border:0;background:#066ab4a6;color:white;border-radius:13px;padding:9px 14px;min-height:46px;font-size:clamp(16px,2vw,23px)}.tool:hover{background:#065b9d}.tool:disabled{opacity:.4;cursor:default}.heading{font-weight:700;font-size:clamp(20px,3vw,30px)}#chooser{flex:1;overflow:auto;padding:12px 5vw 28px}#alphabet{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(8px,2vh,24px);height:100%;align-items:stretch}#alphabet button{border:0;background:transparent;color:#d9f4ff;font-size:clamp(36px,7vh,82px);font-weight:200;border-radius:14px;min-height:60px}#alphabet button:hover,#alphabet button:focus-visible{background:#ffffff29}#workspace{display:none;flex:1;min-height:0;position:relative;overflow:hidden}#drawing{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}.guide{stroke:#b4e7f4;stroke-width:1.2;opacity:.55}.letter{fill:none;stroke:#eafaff;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}.completed{fill:none;stroke:#ffd4e5;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}.start-dot{fill:#f34e81;stroke:white;stroke-width:2}.start-num{fill:white;font-size:9px;font-weight:700;text-anchor:middle;dominant-baseline:middle}.hint{fill:#fff;opacity:.9;font-size:14px;text-anchor:middle}.picture-sticker{pointer-events:none;filter:drop-shadow(0 1px 1px #06577a55)}.status{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#006caaad;border-radius:18px;padding:8px 18px;text-align:center;font-size:clamp(13px,1.7vw,18px);pointer-events:none;max-width:90%}#celebrate{display:none;position:absolute;inset:0;pointer-events:none;align-items:center;justify-content:center;font-size:clamp(36px,7vw,90px);font-weight:800;text-shadow:0 4px 12px #006eaa;animation:pop .55s ease-out}@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}#fireworks{display:none;position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.confetti{position:absolute;font-size:30px;animation:fly 1.5s ease-out forwards;pointer-events:none}@keyframes fly{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--dx),var(--dy)) rotate(400deg);opacity:0}}@media(max-width:600px){header{padding:7px;gap:3px}.tools{gap:4px}.tool{padding:8px;min-height:42px;font-size:16px}.heading{font-size:18px}#alphabet{grid-template-columns:repeat(5,1fr)}#alphabet button{font-size:42px}}
.mode-choice{border:3px solid #c5f4ff;background:#ffffff22;color:white;border-radius:24px;min-width:min(82vw,380px);padding:15px 30px;font-size:clamp(35px,6vw,60px);font-weight:bold}.mode-choice small{display:block;font-size:clamp(16px,2vw,23px);font-weight:normal}.mode-choice:hover,.mode-choice:focus-visible{background:#ffffff44}#modeHome+#alphabet{height:auto;min-height:55vh}#homeChoice{display:none}

/* Welcome screen: warm, cheerful, and optimized for touch screens. */
.app.home-screen{background:radial-gradient(circle at 90% 10%,#fff6d9 0%,transparent 37%),linear-gradient(155deg,#fffaf0 0%,#e9f8fb 65%,#e7e2fb 100%);color:#263d59}

.home-screen .mode-choice{min-width:0;width:100%;border:3px solid #fff;border-radius:28px;min-height:190px;padding:18px 12px;box-shadow:0 10px 28px #365e8520;transition:transform .15s,box-shadow .15s;color:#fff}

/* Version 32: match tracing screens to the welcome-page rose and sage buttons.
   Dark ink and guides keep handwriting legible on pastel backgrounds. */
.app.mode-upper{background:linear-gradient(160deg,#f3b7b8 0%,#eaa0a2 65%,#e3979b 100%);color:#583f46}
.app.mode-lower{background:linear-gradient(160deg,#c2d5af 0%,#a7bf91 65%,#9cb687 100%);color:#344e3b}

.app.mode-upper .tool:hover{background:#784852}

html.access-locked .app{display:none!important}
#passwordGate{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 5% 5%,#f8d6d1 0 13%,transparent 13.3%),radial-gradient(circle at 95% 6%,#d9e6cc 0 13%,transparent 13.3%),#fff9f2;color:#604e49;font-family:Arial,Helvetica,sans-serif}

.password-card{width:min(100%,430px);background:#fff;border:2px solid #f2ded7;border-radius:30px;padding:clamp(22px,5vw,38px);text-align:center;box-shadow:0 16px 42px #6b4c4020}
.password-card h1{font-size:clamp(24px,5vw,32px);margin:6px 0 10px}.password-card p{font-size:16px;line-height:1.45;margin:0 0 22px}
.password-card label{display:block;text-align:left;font-weight:700;font-size:15px;margin-bottom:8px}

.password-card button{width:100%;margin-top:14px;border:0;border-radius:15px;background:#9fb88c;color:#263b2c;padding:15px;font-size:18px;font-weight:700;min-height:52px}
.password-card button:hover{background:#91ad7d}.password-card .show-password{display:flex;align-items:center;gap:9px;margin:12px 0 0;font-size:15px;cursor:pointer}.password-card .show-password input{width:20px;height:20px;min-height:0;margin:0;accent-color:#8da77c}.password-error{min-height:22px;color:#a02f4e;font-size:14px;margin-top:10px}
.password-logo{width:110px;height:110px;object-fit:contain;display:block;margin:0 auto 12px}

    input.value='';error.textContent='';
    unlock();
    return false;
  }
  let remembered=false;
  try{remembered=localStorage.getItem(key)==='yes'}catch(e){}
  try{remembered=remembered||document.cookie.split(';').some(part=>part.trim()===key+'=yes')}catch(e){}
  if(remembered){unlock();return}
  show.addEventListener('change',()=>{input.type=show.checked?'text':'password'});
  input.addEventListener('input',()=>{error.textContent=''});
  form.addEventListener('submit',tryUnlock);
  // A separate click handler also works in touch browsers that fail to dispatch form submit.
  submit.addEventListener('click',tryUnlock);
})();
</script></body></html>
